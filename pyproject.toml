[project]
name = "feedback-dashboard"
version = "0.1.0"
description = "A dashboard for processing and analyzing student feedback."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2.0",
    "pysqlite3-binary; sys_platform != 'win32'"
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
include = [
    "csv_to_sqlite.py",
    "csv_to_sqlite_std.py",
]
